<?xml version="1.0" encoding="utf-8"?>
<!-- 二次元 夜晚星空 animated SVG background -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="40%" stop-color="#101533"/>
      <stop offset="100%" stop-color="#2b1b4a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="70%" cy="18%" r="30%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff8e6" stop-opacity="0" />
    </radialGradient>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="18" /></filter>
  </defs>

  <!-- base night gradient -->
  <rect width="100%" height="100%" fill="url(#nightGrad)" />

  <!-- soft moon glow -->
  <circle cx="1420" cy="140" r="120" fill="url(#moonGlow)" opacity="0.9" filter="url(#blurSoft)" />
  <!-- moon core -->
  <circle cx="1420" cy="140" r="44" fill="#fffbe8" opacity="0.95" />

  <!-- distant fading mountains silhouette -->
  <g fill="#0c1630" opacity="0.7">
    <path d="M0 820 C180 700 360 760 540 720 C720 680 900 740 1080 700 C1260 660 1440 720 1620 680 C1800 640 1920 700 1920 1080 L0 1080 Z"/>
  </g>

  <!-- stars layer 1: many small twinkling dots -->
  <g fill="#ffffff" opacity="0.9">
    <!-- generate a spread of stars -->
    <circle cx="120" cy="80" r="1.3"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="240" cy="210" r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="5.5s" repeatCount="indefinite" /></circle>
    <circle cx="360" cy="60" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite" /></circle>
    <circle cx="480" cy="150" r="1.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="640" cy="40" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="820" cy="90" r="1.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.6s" repeatCount="indefinite" /></circle>
    <circle cx="980" cy="40" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="6.2s" repeatCount="indefinite" /></circle>
    <circle cx="1140" cy="230" r="1.4"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="1280" cy="70" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="5.2s" repeatCount="indefinite" /></circle>
    <circle cx="1560" cy="160" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.9s" repeatCount="indefinite" /></circle>
  </g>

  <!-- shooting stars (sparse animated lines from top-left to bottom-right) -->
  <g stroke="#fff8d8" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <line x1="-80" y1="-20" x2="20" y2="20">
      <animate attributeName="x1" values="-80;1680" dur="12s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="y1" values="-20;980" dur="12s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="x2" values="20;1780" dur="12s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="y2" values="20;1020" dur="12s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite" />
    </line>
    <line x1="-60" y1="40" x2="40" y2="80">
      <animate attributeName="x1" values="-60;1720" dur="18s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="y1" values="40;1020" dur="18s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="x2" values="40;1780" dur="18s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="y2" values="80;1060" dur="18s" repeatCount="indefinite" keyTimes="0;1" />
      <animate attributeName="opacity" values="0;1;0" dur="18s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- foreground soft panels for 二次元 float effect -->
  <g opacity="0.12" fill="#7b5bdc">
    <rect x="60" y="420" width="420" height="200" rx="18">
      <animate attributeName="y" values="420;426;420" dur="9s" repeatCount="indefinite" />
    </rect>
    <rect x="1280" y="520" width="380" height="180" rx="16">
      <animate attributeName="y" values="520;512;520" dur="10s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- subtle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.06" />

</svg>