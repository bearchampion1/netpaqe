    <body id="top">
        <nav class="page_menu" id="pageMenu" aria-label="頁面導覽選單" hidden>

        <div class="page_header">

        <main class="portfolio-page">

                <h1 id="portfolio-title">把喜歡的內容，整理成值得回看的作品。</h1>

            </section>

            <section class="portfolio-list" aria-label="作品列表">
                <article class="portfolio-work">
                    <div class="portfolio-work__media">
                        <img src="image/死亡遊戲12上小說.png" alt="死亡遊戲上集小說分享封面">
                        <span class="portfolio-work__play">播放預覽</span>

                        <p class="portfolio-work__label">VIDEO / STORY</p>
                        <h2>死亡遊戲 12 上集小說</h2>

                            <div><dt>年份</dt><dd>2026</dd></div>
                        </dl>
                    </div>
                    <div class="portfolio-work__description">
                        <p>把複雜的故事線整理成容易進入的觀看體驗，保留作品的情緒，也讓第一次接觸的觀眾快速理解世界觀。</p>
                        <a href="https://youtube.com/@bearchampionanime?si=1_06fL471YjVV3fM" target="_blank" rel="noopener">查看頻道 <span aria-hidden="true">↗</span></a>

                <a class="portfolio-game-card" href="https://japanese-verb-game.vercel.app/#/" aria-label="進入自他動詞遊戲室">

                    <div class="portfolio-game-card__content">

                        <span class="portfolio-game-card__link">進入遊戲 <span aria-hidden="true">↗</span></span>
